<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Pro 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>✨ Weather Pro</h1>

        <form class="weatherForm">
            <input type="text" id="cityInput" class="cityInput" placeholder="Enter City (e.g. Tokyo)" required>
            <button type="submit">Search</button>
        </form>

        <button id="getLocationBtn" class="locationBtn">📍 Use My Location</button>

        <div class="card hidden">
            <div class="current-weather">
                <h2 id="cityName"></h2>
                <h1 id="temperature"></h1>
                <p id="description" class="badge"></p>
            </div>

            <div class="forecast-section">
                <p class="forecast-title">5-Day Forecast</p>
                <div id="forecastContainer" class="forecast-grid">
                    </div>
            </div>
        </div>
    </main>

    <script src="index.js"></script>
</body>
</html>
